<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کنترل پنل YouTube Downloader</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            margin-bottom: 20px;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 { font-size: 2em; margin-bottom: 10px; }
        .header p { opacity: 0.9; }
        
        .form-section {
            padding: 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            transition: all 0.3s;
            font-family: inherit;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        textarea {
            min-height: 100px;
            resize: vertical;
        }
        .quality-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
        }
        .quality-btn {
            background: #f0f0f0;
            padding: 10px;
            text-align: center;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .quality-btn.selected {
            background: #667eea;
            color: white;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .checkbox-group input {
            width: auto;
        }
        
        .token-input {
            direction: ltr;
            font-family: monospace;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1.1em;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .status-section {
            padding: 30px;
            background: #f8f9fa;
            border-top: 1px solid #e0e0e0;
        }
        .run-status {
            background: white;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
        }
        .run-id {
            font-family: monospace;
            color: #667eea;
            word-break: break-all;
        }
        .log-output {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 15px;
            border-radius: 10px;
            font-family: monospace;
            font-size: 0.85em;
            max-height: 300px;
            overflow-y: auto;
            white-space: pre-wrap;
            margin-top: 15px;
        }
        .success { color: #4caf50; }
        .error { color: #f44336; }
        .running { color: #ff9800; }
        
        .links {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 20px;
        }
        .links a {
            color: #667eea;
            text-decoration: none;
        }
        
        @media (max-width: 768px) {
            .form-section, .status-section { padding: 20px; }
            .quality-options { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <h1>🎬 YouTube Downloader Pro</h1>
                <p>دانلود خودکار ویدیو از یوتیوب با GitHub Actions</p>
            </div>
            
            <div class="form-section">
                <div class="form-group">
                    <label>🔗 لینک ویدیو (لینک‌ها را با کاما یا فاصله جدا کنید)</label>
                    <textarea id="videoUrls" placeholder="https://youtube.com/watch?v=...&#10;https://youtu.be/...&#10;https://youtube.com/playlist?list=..."></textarea>
                </div>
                
                <div class="form-group">
                    <label>🎬 کیفیت ویدیو</label>
                    <div class="quality-options" id="qualityOptions">
                        <div class="quality-btn" data-quality="best">بهترین کیفیت</div>
                        <div class="quality-btn" data-quality="2160">4K (2160p)</div>
                        <div class="quality-btn" data-quality="1440">2K (1440p)</div>
                        <div class="quality-btn selected" data-quality="1080">Full HD (1080p)</div>
                        <div class="quality-btn" data-quality="720">HD (720p)</div>
                        <div class="quality-btn" data-quality="480">SD (480p)</div>
                        <div class="quality-btn" data-quality="audio">فقط صدا (MP3)</div>
                    </div>
                </div>
                
                <div class="form-group">
                    <div class="checkbox-group">
                        <input type="checkbox" id="downloadSubtitles">
                        <label for="downloadSubtitles" style="margin:0;">📝 دانلود زیرنویس (فارسی و انگلیسی)</label>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>🔒 رمز فایل (اختیاری)</label>
                    <input type="text" id="password" placeholder="در صورت نیاز رمز وارد کنید">
                </div>
                
                <div class="form-group">
                    <label>🔑 توکن گیت‌هاب (برای اجرای اکشن)</label>
                    <input type="password" id="githubToken" class="token-input" placeholder="ghp_xxxxxxxxxxxx" dir="ltr">
                    <small style="color:#666; display:block; margin-top:5px;">
                        👉 <a href="https://github.com/settings/tokens" target="_blank">ایجاد توکن جدید</a> 
                        (نیاز به دسترسی: repo, workflow)
                    </small>
                </div>
                
                <button id="runBtn" onclick="triggerWorkflow()">🚀 شروع دانلود</button>
            </div>
            
            <div class="status-section">
                <h3>📊 وضعیت اجرا</h3>
                <div id="statusContainer">
                    <p style="color:#666;">هنوز اکشنی اجرا نشده است.</p>
                </div>
            </div>
        </div>
        
        <div class="card">
            <div class="header">
                <h2>📥 ویدیوهای دانلود شده</h2>
            </div>
            <div class="form-section">
                <button onclick="window.location.href='download.html'" style="background:#4caf50;">📂 مشاهده و مدیریت ویدیوها</button>
            </div>
        </div>
    </div>

    <script>
        const owner = 'miladntk';
        const repo = 'yt-dl';
        let currentRunId = null;
        let pollingInterval = null;
        
        // انتخاب کیفیت
        document.querySelectorAll('.quality-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.quality-btn').forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
            });
        });
        
        // تابع برای دریافت لینک‌ها
        function getSelectedQuality() {
            const selected = document.querySelector('.quality-btn.selected');
            return selected ? selected.dataset.quality : '1080';
        }
        
        function getVideoUrls() {
            const urls = document.getElementById('videoUrls').value;
            return urls.split(/[,\n\s]+/).filter(u => u.trim() && u.includes('youtu'));
        }
        
        // تابع برای اجرای workflow از طریق API
        async function triggerWorkflow() {
            const token = document.getElementById('githubToken').value;
            const urls = getVideoUrls();
            const quality = getSelectedQuality();
            const subtitles = document.getElementById('downloadSubtitles').checked;
            const password = document.getElementById('password').value;
            
            if (!token) {
                alert('❌ لطفاً توکن گیت‌هاب را وارد کنید');
                return;
            }
            
            if (urls.length === 0) {
                alert('❌ لطفاً حداقل یک لینک یوتیوب وارد کنید');
                return;
            }
            
            const runBtn = document.getElementById('runBtn');
            runBtn.disabled = true;
            runBtn.textContent = '⏳ در حال اجرا...';
            
            // آماده سازی وضعیت نمایش
            const statusContainer = document.getElementById('statusContainer');
            statusContainer.innerHTML = `
                <div class="run-status">
                    <p><strong>🔄 در حال اجرا...</strong></p>
                    <p>لینک‌ها: ${urls.length} ویدیو</p>
                    <p>کیفیت: ${quality}</p>
                    <p>زیرنویس: ${subtitles ? 'بله' : 'خیر'}</p>
                    <div class="log-output" id="logOutput">در حال اتصال به GitHub API...</div>
                </div>
            `;
            
            try {
                // 1. دریافت workflow ID
                const workflowResponse = await fetch(`https://api.github.com/repos/${owner}/${repo}/actions/workflows`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const workflows = await workflowResponse.json();
                
                // پیدا کردن workflow دانلود
                const downloadWorkflow = workflows.workflows?.find(w => 
                    w.name.includes('YouTube') || w.path.includes('youtube-downloader')
                );
                
                if (!downloadWorkflow) {
                    throw new Error('Workflow دانلود یافت نشد');
                }
                
                // 2. اجرای workflow
                const triggerResponse = await fetch(`https://api.github.com/repos/${owner}/${repo}/actions/workflows/${downloadWorkflow.id}/dispatches`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        ref: 'main',
                        inputs: {
                            video_urls: urls.join(','),
                            quality: quality,
                            download_subtitles: String(subtitles),
                            password: password
                        }
                    })
                });
                
                if (!triggerResponse.ok) {
                    throw new Error(`خطا ${triggerResponse.status}: ${triggerResponse.statusText}`);
                }
                
                // 3. دریافت آخرین run
                await new Promise(resolve => setTimeout(resolve, 5000));
                
                const runsResponse = await fetch(`https://api.github.com/repos/${owner}/${repo}/actions/runs?per_page=1`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const runs = await runsResponse.json();
                
                if (runs.workflow_runs && runs.workflow_runs.length > 0) {
                    currentRunId = runs.workflow_runs[0].id;
                    startPolling(token);
                }
                
            } catch (error) {
                console.error('Error:', error);
                statusContainer.innerHTML = `
                    <div class="run-status">
                        <p class="error">❌ خطا: ${error.message}</p>
                        <p>لطفاً توکن خود را بررسی کنید و دوباره تلاش کنید.</p>
                    </div>
                `;
                runBtn.disabled = false;
                runBtn.textContent = '🚀 شروع دانلود';
            }
        }
        
        // تابع برای دریافت وضعیت اجرا
        async function getRunStatus(token) {
            if (!currentRunId) return;
            
            try {
                const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/actions/runs/${currentRunId}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                const run = await response.json();
                
                // دریافت لاگ‌ها
                const logsResponse = await fetch(`https://api.github.com/repos/${owner}/${repo}/actions/runs/${currentRunId}/logs`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const statusContainer = document.getElementById('statusContainer');
                const statusText = {
                    'queued': '⏳ در صف انتظار',
                    'in_progress': '🔄 در حال اجرا',
                    'completed': '✅ تکمیل شده',
                    'action_required': '⚠️ نیاز به اقدام',
                    'cancelled': '❌ لغو شده',
                    'failure': '❌ ناموفق',
                    'success': '✅ موفق'
                };
                
                const conclusionText = run.conclusion ? {
                    'success': '✅ موفق',
                    'failure': '❌ ناموفق',
                    'cancelled': '❌ لغو شده',
                    'skipped': '⏭️ رد شده'
                } : {};
                
                let logHtml = '<div class="log-output" id="logOutput">';
                if (logsResponse.ok) {
                    const logs = await logsResponse.text();
                    const lastLines = logs.split('\n').slice(-30).join('\n');
                    logHtml += `<pre style="margin:0; color:#d4d4d4;">${escapeHtml(lastLines)}</pre>`;
                } else {
                    logHtml += '<p>لاگ در حال آماده‌سازی...</p>';
                }
                logHtml += '</div>';
                
                statusContainer.innerHTML = `
                    <div class="run-status">
                        <p><strong>📋 وضعیت:</strong> <span class="${run.status === 'completed' ? (run.conclusion === 'success' ? 'success' : 'error') : 'running'}">
                            ${statusText[run.status] || run.status} ${conclusionText[run.conclusion] || ''}
                        </span></p>
                        <p><strong>🆔 Run ID:</strong> <span class="run-id">${run.id}</span></p>
                        <p><strong>🕐 شروع:</strong> ${run.created_at ? new Date(run.created_at).toLocaleString('fa-IR') : '-'}</p>
                        <p><strong>⏱️ پایان:</strong> ${run.updated_at ? new Date(run.updated_at).toLocaleString('fa-IR') : '-'}</p>
                        ${run.conclusion === 'success' ? 
                            `<p class="success">✅ دانلود با موفقیت انجام شد! <a href="download.html" target="_blank">مشاهده ویدیوها</a></p>` : ''}
                        ${logHtml}
                        <div class="links">
                            <a href="https://github.com/${owner}/${repo}/actions/runs/${run.id}" target="_blank">🔗 مشاهده در GitHub</a>
                            <a href="download.html" target="_blank">📂 صفحه مدیریت ویدیوها</a>
                        </div>
                    </div>
                `;
                
                // اگر اجرا تمام شد، poll را متوقف کن
                if (run.status === 'completed') {
                    stopPolling();
                    document.getElementById('runBtn').disabled = false;
                    document.getElementById('runBtn').textContent = '🚀 شروع دانلود';
                }
                
            } catch (error) {
                console.error('Error getting status:', error);
            }
        }
        
        function startPolling(token) {
            if (pollingInterval) clearInterval(pollingInterval);
            getRunStatus(token);
            pollingInterval = setInterval(() => getRunStatus(token), 5000);
        }
        
        function stopPolling() {
            if (pollingInterval) {
                clearInterval(pollingInterval);
                pollingInterval = null;
            }
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // بررسی خودکار توکن در localStorage
        const savedToken = localStorage.getItem('github_token');
        if (savedToken) {
            document.getElementById('githubToken').value = savedToken;
        }
        
        document.getElementById('githubToken').addEventListener('change', (e) => {
            if (e.target.value) {
                localStorage.setItem('github_token', e.target.value);
            }
        });
    </script>
</body>
</html>
