name: Update Files JSON

on:
  push:
    paths:
      - 'videos/**'
  workflow_dispatch:

jobs:
  update-json:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Generate files.json
        run: |
          echo '{ "files": [], "lastUpdate": "'$(date -Iseconds)'" }' > files.json
          
          # اینجا می‌توانید اسکریپت تولید JSON کامل را بنویسید
          
      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add files.json
          git diff --quiet && git diff --staged --quiet || git commit -m "Update files.json [skip ci]"
          git push
