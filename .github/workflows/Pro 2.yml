name: دانلودر حرفه‌ای یوتیوب

on:
  workflow_dispatch:
    inputs:
      video_urls:
        description: '🔗 لینک ویدیو (لینک‌ها را با فاصله جدا کنید)'
        required: true
        type: string
        default: ''
      download_subtitles:
        description: '📝 دانلود زیرنویس (فارسی و انگلیسی)'
        required: false
        default: false
        type: boolean
      quality:
        description: '🎬 کیفیت ویدیو'
        required: false
        default: 'best'
        type: choice
        options:
          - best
          - 2160
          - 1440
          - 1080
          - 720
          - 480
          - audio
      password:
        description: '🔒 رمز فایل زیپ (اختیاری)'
        required: false
        default: ''
        type: string

jobs:
  download-youtube:
    name: "📥 دانلود ویدیو از یوتیوب"
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: "📂 دریافت کد مخزن"
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: "⚙️ تنظیمات Git"
        run: |
          git config --global http.postBuffer 524288000
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: "🌐 راه‌اندازی WARP (پروکسی)"
        run: |
          echo "در حال راه‌اندازی کانتینر WARP..."
          docker network create warp-net 2>/dev/null || true
          docker run -d \
            --name warp \
            --restart=always \
            --network warp-net \
            -p 1080:1080 \
            --cap-add NET_ADMIN \
            --sysctl net.ipv6.conf.all.disable_ipv6=0 \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 \
            -v warp-data:/var/lib/cloudflare-warp \
            caomingjun/warp
          echo "در انتظار راه‌اندازی WARP (15 ثانیه)..."
          sleep 15
          echo "در حال تست اتصال WARP..."
          for i in 1 2 3 4 5; do
            RESULT=$(curl -s --max-time 5 --socks5-hostname 127.0.0.1:1080 https://cloudflare.com/cdn-cgi/trace 2>/dev/null || echo "failed")
            if echo "$RESULT" | grep -qE "warp=(on|plus)"; then
              echo "✅ WARP با موفقیت فعال شد!"
              echo "$RESULT"
              break
            else
              echo "تلاش $i/5 - WARP هنوز آماده نیست، در حال انتظار..."
              sleep 5
            fi
          done

      - name: "📦 نصب پیش‌نیازها"
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip ffmpeg zip unzip p7zip-full curl jq bc
          curl -fsSL https://deno.land/install.sh | sh
          export DENO_INSTALL="$HOME/.deno"
          export PATH="$DENO_INSTALL/bin:$PATH"
          echo "$DENO_INSTALL/bin" >> $GITHUB_PATH
          pip3 install --upgrade yt-dlp
          yt-dlp --version

      - name: "🔍 پردازش لینک‌ها"
        id: process
        run: |
          echo "${{ github.event.inputs.video_urls }}" | tr ' ' '\n' | grep -E '^(https?://)?(www\.)?(youtube\.com|youtu\.be)/' | sort -u > urls.txt
          COUNT=$(wc -l < urls.txt)
          echo "total_urls=$COUNT" >> $GITHUB_OUTPUT
          echo "========================================="
          echo "📊 تعداد ویدیوها: $COUNT"
          echo "========================================="
          if [ $COUNT -eq 0 ]; then
            echo "❌ خطا: هیچ لینک معتبری یافت نشد!"
            exit 1
          fi

      - name: "📥 دانلود ویدیوها (با پشتیبانی از محدودیت سنی)"
        id: download
        env:
          QUALITY: ${{ github.event.inputs.quality }}
          PASSWORD: ${{ github.event.inputs.password }}
          SUBTITLES: ${{ github.event.inputs.download_subtitles }}
        run: |
          sanitize_name() {
            echo "$1" | sed 's/[\/:*?"<>|]/_/g' | sed 's/ /-/g' | tr -s '-'
          }
          
          case "$QUALITY" in
            audio) FORMAT="bestaudio/best" ;;
            best) FORMAT="bestvideo+bestaudio/best" ;;
            2160) FORMAT="bestvideo[height<=2160]+bestaudio/best[height<=2160]" ;;
            1440) FORMAT="bestvideo[height<=1440]+bestaudio/best[height<=1440]" ;;
            1080) FORMAT="bestvideo[height<=1080]+bestaudio/best[height<=1080]" ;;
            720) FORMAT="bestvideo[height<=720]+bestaudio/best[height<=720]" ;;
            480) FORMAT="bestvideo[height<=480]+bestaudio/best[height<=480]" ;;
            *) FORMAT="bestvideo+bestaudio/best" ;;
          esac
          
          mkdir -p videos
          SUCCESS=0
          INDEX=0
          TOTAL=$(wc -l < urls.txt)
          
          while IFS= read -r URL; do
            INDEX=$((INDEX + 1))
            echo ""
            echo "========================================="
            echo "🎬 [$INDEX/$TOTAL] در حال دانلود: $URL"
            echo "========================================="
            
            TITLE=$(yt-dlp --proxy socks5://127.0.0.1:1080 --get-title "$URL" 2>/dev/null | head -1)
            if [ -z "$TITLE" ]; then
              TITLE="video_$INDEX"
            fi
            SAFE_NAME=$(sanitize_name "$TITLE")
            FOLDER="videos/${INDEX}_${SAFE_NAME}"
            mkdir -p "$FOLDER"
            
            DOWNLOAD_OK=false
            
            echo "📡 روش اندروید (مناسب ویدیوهای دارای محدودیت)..."
            if yt-dlp --proxy socks5://127.0.0.1:1080 \
              -f "$FORMAT" \
              --merge-output-format mp4 \
              --extractor-args "youtube:player_client=android" \
              --user-agent "Mozilla/5.0 (Linux; Android 13; SM-S901B) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/112.0.0.0 Mobile Safari/537.36" \
              --no-check-certificates \
              --sleep-requests 2 \
              --sleep-interval 3 \
              --max-sleep-interval 10 \
              --limit-rate 5M \
              --retries 10 \
              -o "$FOLDER/video.%(ext)s" \
              "$URL"; then
              DOWNLOAD_OK=true
              echo "✅ دانلود با روش اندروید موفق بود"
            fi
            
            if [ "$DOWNLOAD_OK" = false ]; then
              echo "📡 روش وب کلاینت..."
              if yt-dlp --proxy socks5://127.0.0.1:1080 \
                -f "$FORMAT" \
                --merge-output-format mp4 \
                --extractor-args "youtube:player_client=web" \
                --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
                --no-check-certificates \
                -o "$FOLDER/video.%(ext)s" \
                "$URL"; then
                DOWNLOAD_OK=true
                echo "✅ دانلود با روش وب کلاینت موفق بود"
              fi
            fi
            
            if [ "$DOWNLOAD_OK" = false ]; then
              echo "📡 دانلود فقط صدا..."
              if yt-dlp --proxy socks5://127.0.0.1:1080 \
                -f "bestaudio" \
                --extract-audio \
                --audio-format mp3 \
                --extractor-args "youtube:player_client=android" \
                -o "$FOLDER/audio.%(ext)s" \
                "$URL"; then
                DOWNLOAD_OK=true
                echo "✅ دانلود صدا موفق بود"
              fi
            fi
            
            if [ "$DOWNLOAD_OK" = false ]; then
              echo "❌ همه روش‌ها برای این لینک ناموفق بودند: $URL"
              rm -rf "$FOLDER"
              continue
            fi
            
            echo "Title: $TITLE" > "$FOLDER/info.txt"
            echo "URL: $URL" >> "$FOLDER/info.txt"
            echo "Quality: $QUALITY" >> "$FOLDER/info.txt"
            echo "Date: $(date '+%Y-%m-%d %H:%M:%S')" >> "$FOLDER/info.txt"
            
            if [ "$SUBTITLES" = "true" ]; then
              echo "📝 در حال دانلود زیرنویس..."
              yt-dlp --proxy socks5://127.0.0.1:1080 \
                --write-sub \
                --sub-langs fa,en \
                --sub-format vtt \
                --skip-download \
                --extractor-args "youtube:player_client=android" \
                -o "$FOLDER/subtitle.%(ext)s" \
                "$URL" 2>/dev/null || true
            fi
            
            SUCCESS=$((SUCCESS + 1))
            echo "✅ دانلود شد: ${SAFE_NAME}"
            
          done < urls.txt
          
          echo "success=$SUCCESS" >> $GITHUB_OUTPUT
          echo "total=$TOTAL" >> $GITHUB_OUTPUT

      - name: "✂️ تکه‌تکه کردن فایل‌های بزرگ (زیر 90 مگابایت)"
        run: |
          echo "========================================="
          echo "✂️ در حال تکه‌تکه کردن فایل‌های بزرگ..."
          echo "========================================="
          
          SPLIT_SIZE=85m
          cd videos
          
          for folder in */; do
            if [ -d "$folder" ]; then
              cd "$folder"
              
              # پیدا کردن فایل ویدیویی
              VIDEO_FILE=$(ls video.mp4 2>/dev/null | head -1)
              if [ -n "$VIDEO_FILE" ] && [ -f "$VIDEO_FILE" ]; then
                FILE_SIZE=$(stat -c%s "$VIDEO_FILE" 2>/dev/null || echo "0")
                SIZE_MB=$((FILE_SIZE / 1024 / 1024))
                
                if [ "$FILE_SIZE" -gt 90000000 ]; then
                  echo "📦 فایل ${SIZE_MB}MB است - نیاز به تکه‌تکه شدن دارد"
                  
                  # تکه‌تکه کردن فایل
                  split -b $SPLIT_SIZE -d "$VIDEO_FILE" "part_"
                  
                  # ایجاد فایل دستورالعمل合并
                  cat > "merge_instructions.txt" << 'MERGEEOF'
برای合并 فایل‌ها در ویندوز:
copy /b part_00 + part_01 + part_02 + part_03 output.mp4

برای合并 در لینوکس/مک:
cat part_* > output.mp4
MERGEEOF
                  
                  # حذف فایل اصلی
                  rm -f "$VIDEO_FILE"
                  
                  # شمارش قطعات
                  PART_COUNT=$(ls part_* 2>/dev/null | wc -l)
                  echo "✅ فایل به $PART_COUNT قطعه تقسیم شد"
                else
                  echo "✅ فایل ${SIZE_MB}MB است - نیازی به تکه‌تکه شدن ندارد"
                fi
              fi
              
              cd ..
            fi
          done
          
          cd ..

      - name: "📦 فشرده‌سازی نهایی (اختیاری)"
        if: github.event.inputs.password != ''
        run: |
          echo "========================================="
          echo "🔒 در حال فشرده‌سازی با رمز..."
          echo "========================================="
          
          PASSWORD="${{ github.event.inputs.password }}"
          
          for folder in videos/*/; do
            if [ -d "$folder" ]; then
              cd "$folder"
              FOLDER_NAME=$(basename "$folder")
              zip -r -P "$PASSWORD" "../${FOLDER_NAME}.zip" .
              cd ..
              rm -rf "$folder"
            fi
          done

      - name: "🛑 توقف WARP"
        if: always()
        run: |
          docker stop warp 2>/dev/null || true
          docker rm warp 2>/dev/null || true

      - name: "📤 ارسال به مخزن (با مدیریت فایل‌های بزرگ)"
        run: |
          echo "========================================="
          echo "📤 در حال ارسال فایل‌ها به مخزن..."
          echo "========================================="
          
          git fetch origin
          git reset --hard origin/${{ github.ref_name }} 2>/dev/null || true
          
          # ایجاد README اصلی
          cat > videos/README.md << 'EOF'
# 📥 ویدیوهای دانلود شده

این فایل‌ها به صورت خودکار توسط GitHub Actions دانلود شده‌اند.

## 📊 راهنمای合并 فایل‌های تکه‌تکه شده

اگر فایل به چند قطعه تقسیم شده است:

### ویندوز:
```cmd
copy /b part_00 + part_01 + part_02 output.mp4
