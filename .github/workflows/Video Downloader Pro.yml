name: YouTube Downloader Pro

on:
  workflow_dispatch:
    inputs:
      video_urls:
        description: 'لینک ویدیو (لینک ها را با کاما یا خط جدید جدا کنید)'
        required: true
        type: string
        default: ''
      download_subtitles:
        description: 'دانلود زیرنویس (فارسی و انگلیسی)'
        required: false
        default: false
        type: boolean
      quality:
        description: 'کیفیت ویدیو'
        required: false
        default: 'best'
        type: choice
        options:
          - best
          - 2160
          - 1440
          - 1080
          - 720
          - 480
          - audio
      password:
        description: 'رمز فایل زیپ (اختیاری)'
        required: false
        default: ''
        type: string
      create_archive:
        description: 'ایجاد فایل نهایی فشرده'
        required: false
        default: true
        type: boolean

jobs:
  download-youtube:
    name: Download YouTube Videos
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip ffmpeg zip unzip p7zip-full curl jq
          pip3 install --upgrade yt-dlp

      - name: Process URLs
        id: process
        run: |
          echo "${{ github.event.inputs.video_urls }}" | \
            sed 's/[،,、+ ]/\n/g' | \
            grep -E '^(https?://)?(www\.)?(youtube\.com|youtu\.be)/' | \
            sort -u > urls.txt
          
          COUNT=$(wc -l < urls.txt)
          echo "total_urls=$COUNT" >> $GITHUB_OUTPUT
          echo "Total videos: $COUNT"

      - name: Download videos
        id: download
        env:
          QUALITY: ${{ github.event.inputs.quality }}
          PASSWORD: ${{ github.event.inputs.password }}
          SUBTITLES: ${{ github.event.inputs.download_subtitles }}
        run: |
          sanitize() {
            echo "$1" | sed 's/[\/:*?"<>|]/_/g' | sed 's/  */ /g' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'
          }
          
          case "$QUALITY" in
            audio) FORMAT="bestaudio/best" ;;
            2160) FORMAT="bestvideo[height<=2160]+bestaudio/best[height<=2160]" ;;
            1440) FORMAT="bestvideo[height<=1440]+bestaudio/best[height<=1440]" ;;
            1080) FORMAT="bestvideo[height<=1080]+bestaudio/best[height<=1080]" ;;
            720) FORMAT="bestvideo[height<=720]+bestaudio/best[height<=720]" ;;
            480) FORMAT="bestvideo[height<=480]+bestaudio/best[height<=480]" ;;
            *) FORMAT="bestvideo+bestaudio/best" ;;
          esac
          
          # گزینه‌های yt-dlp بدون پروکسی (در صورت نیاز می‌توانید پروکسی اضافه کنید)
          YT_OPTS="--no-playlist \
            --retries 10 \
            --fragment-retries 10 \
            --sleep-requests 1 \
            --sleep-interval 2 \
            --max-sleep-interval 5 \
            --limit-rate 10M \
            --no-mtime"
          
          # اگر به پروکسی نیاز دارید از این استفاده کنید
          # YT_OPTS="--proxy socks5://127.0.0.1:1080 $YT_OPTS"
          
          mkdir -p downloads
          SUCCESS=0
          FAILED_LIST=""
          INDEX=0
          TOTAL=$(wc -l < urls.txt)
          
          while IFS= read -r URL; do
            INDEX=$((INDEX + 1))
            echo ""
            echo "==========================================="
            echo "[$INDEX/$TOTAL] $URL"
            echo "==========================================="
            
            # دریافت اطلاعات ویدیو
            TITLE=$(yt-dlp $YT_OPTS --get-title "$URL" 2>/dev/null | head -1)
            if [ -z "$TITLE" ]; then
              TITLE="video_$INDEX"
            fi
            SAFE_NAME=$(sanitize "$TITLE")
            FOLDER="downloads/${INDEX}_${SAFE_NAME}"
            mkdir -p "$FOLDER"
            
            # دانلود ویدیو با چند روش مختلف
            DOWNLOAD_OK=false
            
            # روش اول: با فرمت مشخص شده
            if [ "$QUALITY" = "audio" ]; then
              if yt-dlp $YT_OPTS \
                -f "$FORMAT" \
                --extract-audio \
                --audio-format mp3 \
                --audio-quality 0 \
                -o "$FOLDER/audio.%(ext)s" \
                "$URL" 2>&1; then
                DOWNLOAD_OK=true
              fi
            else
              if yt-dlp $YT_OPTS \
                -f "$FORMAT" \
                --merge-output-format mp4 \
                --write-thumbnail \
                --convert-thumbnails jpg \
                -o "$FOLDER/video.%(ext)s" \
                "$URL" 2>&1; then
                DOWNLOAD_OK=true
              fi
            fi
            
            # روش دوم: اگر روش اول失败، با کیفیت پایین‌تر
            if [ "$DOWNLOAD_OK" = false ]; then
              echo "Retrying with best format..."
              if yt-dlp $YT_OPTS \
                -f "best" \
                -o "$FOLDER/video.%(ext)s" \
                "$URL" 2>&1; then
                DOWNLOAD_OK=true
              fi
            fi
            
            # روش سوم: اگر باز هم失败، فقط صدا
            if [ "$DOWNLOAD_OK" = false ]; then
              echo "Retrying with audio only..."
              if yt-dlp $YT_OPTS \
                -f "bestaudio" \
                --extract-audio \
                --audio-format mp3 \
                -o "$FOLDER/audio.%(ext)s" \
                "$URL" 2>&1; then
                DOWNLOAD_OK=true
              fi
            fi
            
            if [ "$DOWNLOAD_OK" = false ]; then
              echo "Download failed: $URL"
              FAILED_LIST="$FAILED_LIST $URL"
              rm -rf "$FOLDER"
              continue
            fi
            
            # دانلود زیرنویس
            if [ "$SUBTITLES" = "true" ]; then
              echo "Downloading subtitles..."
              yt-dlp $YT_OPTS \
                --write-sub \
                --sub-langs fa,en \
                --sub-format vtt \
                --skip-download \
                -o "$FOLDER/subtitle.%(ext)s" \
                "$URL" 2>/dev/null || true
              
              if [ -f "$FOLDER/subtitle.fa.vtt" ] || [ -f "$FOLDER/subtitle.en.vtt" ]; then
                cd "$FOLDER" || true
                zip -j subtitles.zip *.vtt 2>/dev/null || true
                cd ../..
                echo "Subtitles downloaded successfully"
              fi
            fi
            
            # ایجاد فایل اطلاعات
            cat > "$FOLDER/info.txt" << 'INFOEOF'
Title: TITLE_PLACEHOLDER
URL: URL_PLACEHOLDER
Quality: QUALITY_PLACEHOLDER
Date: DATE_PLACEHOLDER
INFOEOF
            sed -i "s|TITLE_PLACEHOLDER|$TITLE|g" "$FOLDER/info.txt"
            sed -i "s|URL_PLACEHOLDER|$URL|g" "$FOLDER/info.txt"
            sed -i "s|QUALITY_PLACEHOLDER|${QUALITY:-best}|g" "$FOLDER/info.txt"
            sed -i "s|DATE_PLACEHOLDER|$(date '+%Y-%m-%d %H:%M:%S')|g" "$FOLDER/info.txt"
            
            # فشرده‌سازی نهایی
            CREATE_ARCHIVE="${{ github.event.inputs.create_archive }}"
            if [ "$CREATE_ARCHIVE" = "true" ]; then
              echo "Creating archive..."
              if [ -n "$PASSWORD" ]; then
                zip -r -P "$PASSWORD" "${FOLDER}.zip" "$FOLDER" > /dev/null 2>&1
                rm -rf "$FOLDER"
              else
                zip -r "${FOLDER}.zip" "$FOLDER" > /dev/null 2>&1
                rm -rf "$FOLDER"
              fi
            fi
            
            SUCCESS=$((SUCCESS + 1))
            echo "Downloaded: ${SAFE_NAME}"
            
          done < urls.txt
          
          echo "success=$SUCCESS" >> $GITHUB_OUTPUT
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "failed=$FAILED_LIST" >> $GITHUB_OUTPUT
          
          echo ""
          echo "==========================================="
          echo "Download completed: $SUCCESS of $TOTAL"
          echo "==========================================="

      - name: Push to repository
        if: success() && steps.download.outputs.success > 0
        run: |
          git pull --rebase origin ${{ github.ref_name }} 2>/dev/null || true
          
          echo "# Downloaded Videos" > downloads/README.md
          echo "" >> downloads/README.md
          echo "These files were automatically downloaded by GitHub Actions" >> downloads/README.md
          echo "" >> downloads/README.md
          echo "| # | Video | Status |" >> downloads/README.md
          echo "|---|-------|--------|" >> downloads/README.md
          
          COUNT=1
          for item in downloads/*.zip downloads/*/; do
            if [ -e "$item" ]; then
              NAME=$(basename "$item" .zip)
              NAME=$(basename "$NAME" | cut -d'_' -f2-)
              if [ -z "$NAME" ]; then
                NAME="Video $COUNT"
              fi
              echo "| $COUNT | $NAME | ✅ |" >> downloads/README.md
              COUNT=$((COUNT + 1))
            fi
          done
          
          echo "" >> downloads/README.md
          echo "---" >> downloads/README.md
          echo "**📊 Stats:** ${{ steps.download.outputs.success }} videos downloaded successfully" >> downloads/README.md
          
          if [ -n "${{ steps.download.outputs.failed }}" ]; then
            echo "" >> downloads/README.md
            echo "**❌ Failed URLs:**" >> downloads/README.md
            echo '${{ steps.download.outputs.failed }}' >> downloads/README.md
          fi
          
          git add downloads/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-download: ${{ steps.download.outputs.success }} videos [skip ci]"
            git push origin HEAD:${{ github.ref_name }} || echo "Failed to push"
          fi

      - name: Final report
        if: always()
        run: |
          echo "==========================================="
          echo "Final Download Report"
          echo "==========================================="
          echo "✅ Success: ${{ steps.download.outputs.success }}"
          echo "📊 Total: ${{ steps.download.outputs.total }}"
          FAILED_VALUES="${{ steps.download.outputs.failed }}"
          if [ -n "$FAILED_VALUES" ]; then
            echo "❌ Failed URLs: $FAILED_VALUES"
          fi
          echo "==========================================="
