name: YouTube Downloader Pro

on:
  workflow_dispatch:
    inputs:
      video_urls:
        description: 'لینک ویدیو (لینک ها را با کاما یا خط جدید جدا کنید)'
        required: true
        type: string
        default: ''
      download_subtitles:
        description: 'دانلود زیرنویس (فارسی و انگلیسی)'
        required: false
        default: false
        type: boolean
      quality:
        description: 'کیفیت ویدیو'
        required: false
        default: 'best'
        type: choice
        options:
          - best
          - 2160
          - 1440
          - 1080
          - 720
          - 480
          - audio
      password:
        description: 'رمز فایل زیپ (اختیاری)'
        required: false
        default: ''
        type: string
      create_archive:
        description: 'ایجاد فایل نهایی فشرده'
        required: false
        default: true
        type: boolean

jobs:
  download-youtube:
    name: Download YouTube Videos
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip ffmpeg zip unzip p7zip-full curl jq
          pip3 install --upgrade yt-dlp
          yt-dlp --version

      - name: Process URLs
        id: process
        run: |
          echo "${{ github.event.inputs.video_urls }}" | \
            sed 's/[،,、+ ]/\n/g' | \
            grep -E '^(https?://)?(www\.)?(youtube\.com|youtu\.be)/' | \
            sort -u > urls.txt
          
          COUNT=$(wc -l < urls.txt)
          echo "total_urls=$COUNT" >> $GITHUB_OUTPUT
          echo "Total videos: $COUNT"
          echo "URLs to download:"
          cat urls.txt
          
          if [ $COUNT -eq 0 ]; then
            echo "ERROR: No valid URLs found!"
            exit 1
          fi

      - name: Download videos
        id: download
        env:
          QUALITY: ${{ github.event.inputs.quality }}
          PASSWORD: ${{ github.event.inputs.password }}
          SUBTITLES: ${{ github.event.inputs.download_subtitles }}
        run: |
          sanitize() {
            echo "$1" | sed 's/[\/:*?"<>|]/_/g' | sed 's/  */ /g' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'
          }
          
          case "$QUALITY" in
            audio) FORMAT="bestaudio/best" ;;
            2160) FORMAT="bestvideo[height<=2160]+bestaudio/best[height<=2160]" ;;
            1440) FORMAT="bestvideo[height<=1440]+bestaudio/best[height<=1440]" ;;
            1080) FORMAT="bestvideo[height<=1080]+bestaudio/best[height<=1080]" ;;
            720) FORMAT="bestvideo[height<=720]+bestaudio/best[height<=720]" ;;
            480) FORMAT="bestvideo[height<=480]+bestaudio/best[height<=480]" ;;
            *) FORMAT="bestvideo+bestaudio/best" ;;
          esac
          
          YT_OPTS="--no-playlist --retries 3 --fragment-retries 3 --no-mtime"
          
          mkdir -p videos
          echo "Created videos directory"
          
          SUCCESS=0
          FAILED_LIST=""
          INDEX=0
          TOTAL=$(wc -l < urls.txt)
          
          while IFS= read -r URL; do
            INDEX=$((INDEX + 1))
            echo ""
            echo "==========================================="
            echo "[$INDEX/$TOTAL] Downloading: $URL"
            echo "==========================================="
            
            TITLE=$(yt-dlp --get-title "$URL" 2>/dev/null | head -1)
            if [ -z "$TITLE" ]; then
              TITLE="video_$INDEX"
            fi
            echo "Title: $TITLE"
            
            SAFE_NAME=$(sanitize "$TITLE")
            FOLDER="videos/${INDEX}_${SAFE_NAME}"
            mkdir -p "$FOLDER"
            
            DOWNLOAD_OK=false
            if [ "$QUALITY" = "audio" ]; then
              if yt-dlp $YT_OPTS -f "$FORMAT" --extract-audio --audio-format mp3 -o "$FOLDER/audio.%(ext)s" "$URL"; then
                DOWNLOAD_OK=true
              fi
            else
              if yt-dlp $YT_OPTS -f "$FORMAT" --merge-output-format mp4 -o "$FOLDER/video.%(ext)s" "$URL"; then
                DOWNLOAD_OK=true
              fi
            fi
            
            if [ "$DOWNLOAD_OK" = false ]; then
              echo "ERROR: Download failed for: $URL"
              FAILED_LIST="$FAILED_LIST $URL"
              rm -rf "$FOLDER"
              continue
            fi
            
            echo "Downloaded files:"
            ls -la "$FOLDER"
            
            if [ "$SUBTITLES" = "true" ]; then
              yt-dlp $YT_OPTS --write-sub --sub-langs fa,en --skip-download -o "$FOLDER/subtitle.%(ext)s" "$URL" 2>/dev/null || true
            fi
            
            echo "Title: $TITLE" > "$FOLDER/info.txt"
            echo "URL: $URL" >> "$FOLDER/info.txt"
            echo "Quality: ${QUALITY:-best}" >> "$FOLDER/info.txt"
            echo "Date: $(date '+%Y-%m-%d %H:%M:%S')" >> "$FOLDER/info.txt"
            
            if [ "${{ github.event.inputs.create_archive }}" = "true" ]; then
              if [ -n "$PASSWORD" ]; then
                zip -r -P "$PASSWORD" "${FOLDER}.zip" "$FOLDER"
              else
                zip -r "${FOLDER}.zip" "$FOLDER"
              fi
              rm -rf "$FOLDER"
            fi
            
            SUCCESS=$((SUCCESS + 1))
            echo "Downloaded: ${SAFE_NAME}"
            
          done < urls.txt
          
          echo "success=$SUCCESS" >> $GITHUB_OUTPUT
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "failed=$FAILED_LIST" >> $GITHUB_OUTPUT
          
          echo ""
          echo "==========================================="
          echo "Download Summary"
          echo "==========================================="
          echo "Successful: $SUCCESS"
          echo "Failed: $((TOTAL - SUCCESS))"
          echo ""
          echo "Contents of videos folder:"
          ls -la videos/ 2>/dev/null || echo "videos folder is empty"

      - name: Commit and push
        if: steps.download.outputs.success > 0
        run: |
          if [ ! -d "videos" ] || [ -z "$(ls -A videos 2>/dev/null)" ]; then
            echo "No files to commit"
            exit 0
          fi
          
          git add videos/
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add downloaded videos: ${{ steps.download.outputs.success }} items [skip ci]"
            git pull --rebase origin ${{ github.ref_name }} 2>/dev/null || true
            git push origin HEAD:${{ github.ref_name }}
            echo "Successfully pushed to repository"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: downloaded-videos-backup
          path: videos/
          retention-days: 7

      - name: Final report
        if: always()
        run: |
          echo "==========================================="
          echo "Final Download Report"
          echo "==========================================="
          echo "Success: ${{ steps.download.outputs.success }}"
          echo "Total: ${{ steps.download.outputs.total }}"
          echo "==========================================="
