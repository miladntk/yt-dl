name: YouTube Downloader Pro

on:
  workflow_dispatch:
    inputs:
      video_urls:
        description: 'لینک ویدیو (لینک ها را با کاما یا خط جدید جدا کنید)'
        required: true
        type: string
        default: ''
      download_subtitles:
        description: 'دانلود زیرنویس (فارسی و انگلیسی)'
        required: false
        default: false
        type: boolean
      quality:
        description: 'کیفیت ویدیو'
        required: false
        default: 'best'
        type: choice
        options:
          - best
          - 2160
          - 1440
          - 1080
          - 720
          - 480
          - audio
      password:
        description: 'رمز فایل زیپ (اختیاری)'
        required: false
        default: ''
        type: string
      create_archive:
        description: 'ایجاد فایل نهایی فشرده'
        required: false
        default: true
        type: boolean

jobs:
  download-youtube:
    name: Download YouTube Videos
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip ffmpeg zip unzip p7zip-full curl jq
          pip3 install --upgrade yt-dlp
          # بررسی نصب موفق
          yt-dlp --version

      - name: Process URLs
        id: process
        run: |
          echo "${{ github.event.inputs.video_urls }}" | \
            sed 's/[،,、+ ]/\n/g' | \
            grep -E '^(https?://)?(www\.)?(youtube\.com|youtu\.be)/' | \
            sort -u > urls.txt
          
          COUNT=$(wc -l < urls.txt)
          echo "total_urls=$COUNT" >> $GITHUB_OUTPUT
          echo "Total videos: $COUNT"
          
          # نمایش لینک‌ها برای دیباگ
          echo "URLs to download:"
          cat urls.txt
          
          if [ $COUNT -eq 0 ]; then
            echo "ERROR: No valid URLs found!"
            exit 1
          fi

      - name: Download videos (with debug)
        id: download
        env:
          QUALITY: ${{ github.event.inputs.quality }}
          PASSWORD: ${{ github.event.inputs.password }}
          SUBTITLES: ${{ github.event.inputs.download_subtitles }}
        run: |
          # تابع sanitize
          sanitize() {
            echo "$1" | sed 's/[\/:*?"<>|]/_/g' | sed 's/  */ /g' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'
          }
          
          # تنظیم کیفیت
          case "$QUALITY" in
            audio) FORMAT="bestaudio/best" ;;
            2160) FORMAT="bestvideo[height<=2160]+bestaudio/best[height<=2160]" ;;
            1440) FORMAT="bestvideo[height<=1440]+bestaudio/best[height<=1440]" ;;
            1080) FORMAT="bestvideo[height<=1080]+bestaudio/best[height<=1080]" ;;
            720) FORMAT="bestvideo[height<=720]+bestaudio/best[height<=720]" ;;
            480) FORMAT="bestvideo[height<=480]+bestaudio/best[height<=480]" ;;
            *) FORMAT="bestvideo+bestaudio/best" ;;
          esac
          
          YT_OPTS="--no-playlist \
            --retries 3 \
            --fragment-retries 3 \
            --no-mtime \
            --verbose"
          
          # ایجاد پوشه videos
          mkdir -p videos
          echo "Created videos directory at: $(pwd)/videos"
          
          SUCCESS=0
          FAILED_LIST=""
          INDEX=0
          TOTAL=$(wc -l < urls.txt)
          
          while IFS= read -r URL; do
            INDEX=$((INDEX + 1))
            echo ""
            echo "==========================================="
            echo "[$INDEX/$TOTAL] Downloading: $URL"
            echo "==========================================="
            
            # دریافت عنوان ویدیو
            echo "Getting video title..."
            TITLE=$(yt-dlp $YT_OPTS --get-title "$URL" 2>&1)
            if [ -z "$TITLE" ] || echo "$TITLE" | grep -q "ERROR"; then
              echo "WARNING: Could not get title, using fallback"
              TITLE="video_$INDEX"
            fi
            echo "Title: $TITLE"
            
            SAFE_NAME=$(sanitize "$TITLE")
            FOLDER="videos/${INDEX}_${SAFE_NAME}"
            echo "Target folder: $FOLDER"
            mkdir -p "$FOLDER"
            
            # دانلود
            DOWNLOAD_OK=false
            echo "Starting download with format: $FORMAT"
            
            if [ "$QUALITY" = "audio" ]; then
              if yt-dlp $YT_OPTS \
                -f "$FORMAT" \
                --extract-audio \
                --audio-format mp3 \
                --audio-quality 0 \
                -o "$FOLDER/audio.%(ext)s" \
                "$URL"; then
                DOWNLOAD_OK=true
                echo "Audio download successful"
              else
                echo "Audio download failed"
              fi
            else
              if yt-dlp $YT_OPTS \
                -f "$FORMAT" \
                --merge-output-format mp4 \
                --write-thumbnail \
                --convert-thumbnails jpg \
                -o "$FOLDER/video.%(ext)s" \
                "$URL"; then
                DOWNLOAD_OK=true
                echo "Video download successful"
              else
                echo "Video download failed"
              fi
            fi
            
            if [ "$DOWNLOAD_OK" = false ]; then
              echo "ERROR: Download failed for: $URL"
              FAILED_LIST="$FAILED_LIST $URL"
              rm -rf "$FOLDER"
              continue
            fi
            
            # بررسی وجود فایل دانلود شده
            echo "Checking downloaded files in $FOLDER:"
            ls -la "$FOLDER"
            
            # دانلود زیرنویس
            if [ "$SUBTITLES" = "true" ]; then
              echo "Downloading subtitles..."
              yt-dlp $YT_OPTS \
                --write-sub \
                --sub-langs fa,en \
                --sub-format vtt \
                --skip-download \
                -o "$FOLDER/subtitle.%(ext)s" \
                "$URL" 2>/dev/null || true
            fi
            
            # ایجاد فایل info
            cat > "$FOLDER/info.txt" << EOF
Title: $TITLE
URL: $URL
Quality: ${QUALITY:-best}
Date: $(date '+%Y-%m-%d %H:%M:%S')
EOF
            
            # فشرده‌سازی
            CREATE_ARCHIVE="${{ github.event.inputs.create_archive }}"
            if [ "$CREATE_ARCHIVE" = "true" ]; then
              echo "Creating archive..."
              if [ -n "$PASSWORD" ]; then
                zip -r -P "$PASSWORD" "${FOLDER}.zip" "$FOLDER"
                rm -rf "$FOLDER"
              else
                zip -r "${FOLDER}.zip" "$FOLDER"
                rm -rf "$FOLDER"
              fi
            fi
            
            SUCCESS=$((SUCCESS + 1))
            echo "Successfully downloaded: ${SAFE_NAME}"
            
          done < urls.txt
          
          # ذخیره نتایج
          echo "success=$SUCCESS" >> $GITHUB_OUTPUT
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "failed=$FAILED_LIST" >> $GITHUB_OUTPUT
          
          # نمایش نتایج نهایی
          echo ""
          echo "==========================================="
          echo "Download Summary"
          echo "==========================================="
          echo "Successful: $SUCCESS"
          echo "Failed: $((TOTAL - SUCCESS))"
          echo ""
          echo "Contents of videos folder:"
          ls -la videos/ || echo "videos folder is empty or does not exist"
          echo ""
          echo "Finding media files:"
          find videos -type f \( -name "*.mp4" -o -name "*.mp3" -o -name "*.zip" \) 2>/dev/null || echo "No media files found"

      - name: Commit and push (if files exist)
        if: steps.download.outputs.success > 0
        run: |
          # بررسی وجود فایل
          if [ ! -d "videos" ] || [ -z "$(ls -A videos 2>/dev/null)" ]; then
            echo "No files found in videos folder to commit"
            exit 0
          fi
          
          echo "Files found in videos folder:"
          ls -la videos/
          
          git add videos/
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add downloaded videos: ${{ steps.download.outputs.success }} items [skip ci]"
            git pull --rebase origin ${{ github.ref_name }} 2>/dev/null || true
            git push origin HEAD:${{ github.ref_name }}
            echo "Successfully pushed to repository"
          fi

      - name: Upload artifacts (always try)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: downloaded-videos-$(date +'%Y%m%d-%H%M%S')
          path: videos/
          retention-days: 7

      - name: Final report
        if: always()
        run: |
          echo "==========================================="
          echo "Final Download Report"
          echo "==========================================="
          echo "Success: ${{ steps.download.outputs.success }}"
          echo "Total: ${{ steps.download.outputs.total }}"
          echo "==========================================="
          echo ""
          echo "To access downloaded files:"
          echo "1. Check 'videos' folder in repository"
          echo "2. Download artifact from Actions tab"
          echo "==========================================="
