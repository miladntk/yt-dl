<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دانلود همه ویدیوها - yt-dl</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 { font-size: 2em; margin-bottom: 10px; }
        .header p { opacity: 0.9; }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            padding: 20px 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #e0e0e0;
        }
        .stat-card {
            text-align: center;
            padding: 15px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .stat-card h3 { color: #667eea; font-size: 1.8em; }
        .stat-card p { color: #666; font-size: 0.9em; }
        .video-section {
            margin: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 15px;
            border-right: 5px solid #667eea;
        }
        .video-title {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 15px;
            word-break: break-all;
        }
        .video-title small {
            font-size: 0.7em;
            color: #666;
        }
        .download-methods {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        .method-card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #e0e0e0;
        }
        .method-card h4 {
            color: #667eea;
            margin-bottom: 10px;
        }
        button, .btn {
            background: #4caf50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            margin: 5px;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        button:hover, .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .btn-folder { background: #ff9800; }
        .btn-github { background: #24292e; }
        .btn-download-all { background: #2196f3; }
        .parts-list {
            margin-top: 15px;
            padding: 10px;
            background: #fff;
            border-radius: 8px;
            max-height: 300px;
            overflow-y: auto;
        }
        .part-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            border-bottom: 1px solid #eee;
            flex-wrap: wrap;
            gap: 10px;
        }
        .part-item:last-child { border-bottom: none; }
        .part-name { font-family: monospace; font-size: 0.9em; word-break: break-all; flex: 1; }
        .part-size { color: #666; font-size: 0.8em; min-width: 80px; }
        .loading, .error {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        .error { color: #f44336; }
        hr { margin: 20px 0; border: none; border-top: 1px solid #e0e0e0; }
        .merge-instruction {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            font-size: 0.9em;
        }
        .merge-instruction pre {
            background: #263238;
            color: #ffb74d;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
            font-size: 0.8em;
            margin-top: 10px;
        }
        @media (max-width: 768px) {
            .video-title { font-size: 1.2em; }
            .method-card { padding: 10px; }
            .part-item { flex-direction: column; align-items: flex-start; }
            button, .btn { padding: 8px 15px; font-size: 0.8em; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📥 دانلود همه ویدیوهای ذخیره شده</h1>
            <p>لیست تمام ویدیوهای موجود در مخزن | YouTube Downloader Pro</p>
        </div>
        
        <div class="stats" id="stats">
            <div class="stat-card"><h3 id="totalVideos">-</h3><p>تعداد ویدیوها</p></div>
            <div class="stat-card"><h3 id="totalSize">-</h3><p>حجم کل</p></div>
            <div class="stat-card"><h3 id="lastUpdate">-</h3><p>آخرین بروزرسانی</p></div>
        </div>
        
        <div id="videos-container">
            <div class="loading">⏳ در حال بارگذاری لیست ویدیوها از GitHub...</div>
        </div>
    </div>

    <script>
        const owner = 'miladntk';
        const repo = 'yt-dl';
        let allVideosData = [];
        
        // تابع کمکی برای فرمت حجم
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 B';
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(1024));
            return (bytes / Math.pow(1024, i)).toFixed(2) + ' ' + sizes[i];
        }
        
        // تابع برای دریافت همه پوشه‌های داخل videos
        async function getAllVideoFolders() {
            try {
                const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/videos`);
                if (!response.ok) throw new Error('خطا در دریافت اطلاعات');
                
                const contents = await response.json();
                const folders = contents.filter(item => item.type === 'dir');
                
                return folders;
            } catch (error) {
                console.error('Error:', error);
                return [];
            }
        }
        
        // تابع برای دریافت فایل‌های داخل یک پوشه
        async function getFolderContents(folderPath) {
            try {
                const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${folderPath}`);
                if (!response.ok) return [];
                return await response.json();
            } catch (error) {
                return [];
            }
        }
        
        // تابع برای شناسایی قطعات zip
        function groupZipParts(files) {
            const zipParts = {};
            const otherFiles = [];
            
            files.forEach(file => {
                if (file.type !== 'file') return;
                
                if (file.name.match(/\.(zip|z[0-9]+)$/)) {
                    const baseName = file.name.replace(/\.(zip|z[0-9]+)$/, '');
                    if (!zipParts[baseName]) zipParts[baseName] = [];
                    zipParts[baseName].push(file);
                } else {
                    otherFiles.push(file);
                }
            });
            
            return { zipParts, otherFiles };
        }
        
        // تابع برای دانلود همه قطعات یک مجموعه zip
        function downloadAllParts(parts, folderName) {
            alert(`شروع دانلود ${parts.length} قطعه برای "${folderName}". ممکن است مرورگر چندین بار اجازه بگیرد.`);
            
            parts.forEach((part, index) => {
                setTimeout(() => {
                    const link = document.createElement('a');
                    link.href = part.download_url;
                    link.download = part.name;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                }, index * 800);
            });
        }
        
        // تابع برای ایجاد دکمه‌های دانلود
        function renderVideoSection(folder, files) {
            const { zipParts, otherFiles } = groupZipParts(files);
            const hasZipParts = Object.keys(zipParts).length > 0;
            
            let partsHtml = '';
            let totalPartsSize = 0;
            
            if (hasZipParts) {
                for (const [baseName, parts] of Object.entries(zipParts)) {
                    const totalSize = parts.reduce((sum, p) => sum + p.size, 0);
                    totalPartsSize += totalSize;
                    
                    partsHtml += `
                        <div class="method-card">
                            <h4>📦 فایل چندتکه (${parts.length} قطعه)</h4>
                            <p>حجم کل: ${formatFileSize(totalSize)}</p>
                            <button onclick='downloadAllParts(${JSON.stringify(parts)}, "${folder.name}")' class="btn-download-all">
                                ⬇️ دانلود همه ${parts.length} قطعه
                            </button>
                            <div class="parts-list">
                                ${parts.map(part => `
                                    <div class="part-item">
                                        <span class="part-name">📄 ${part.name}</span>
                                        <span class="part-size">${formatFileSize(part.size)}</span>
                                        <a href="${part.download_url}" download><button style="padding:5px 10px; font-size:0.8em;">دانلود</button></a>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                }
            }
            
            // فایل‌های معمولی (غیر zip)
            if (otherFiles.length > 0) {
                partsHtml += `
                    <div class="method-card">
                        <h4>📄 فایل‌های معمولی</h4>
                        <div class="parts-list">
                            ${otherFiles.map(file => `
                                <div class="part-item">
                                    <span class="part-name">${file.name}</span>
                                    <span class="part-size">${formatFileSize(file.size)}</span>
                                    <a href="${file.download_url}" download><button style="padding:5px 10px;">⬇️ دانلود</button></a>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }
            
            // دستور合并 (فقط اگر فایل چندتکه وجود داشته باشد)
            const mergeCommand = hasZipParts ? `
                <div class="merge-instruction">
                    <strong>🔧 نحوه合并 قطعات بعد از دانلود:</strong>
                    <pre>copy /B "${folder.name}.zip" + "${folder.name}.z01" + "${folder.name}.z02" + "${folder.name}.z03" "video-final.zip"</pre>
                    <small>⚠️ تعداد فایل‌های z01, z02, ... را بر اساس فایل‌های دانلود شده تنظیم کنید. سپس فایل video-final.zip را extract کنید.</small>
                </div>
            ` : '';
            
            return `
                <div class="video-section" data-folder="${folder.name}">
                    <div class="video-title">
                        📁 ${escapeHtml(folder.name)}
                        <small>(${files.length} فایل)</small>
                    </div>
                    
                    <div class="download-methods">
                        <div class="method-card">
                            <h4>📂 مشاهده در GitHub</h4>
                            <p>مشاهده مستقیم و دانلود دستی</p>
                            <a href="${folder.html_url}" target="_blank" class="btn btn-folder">📂 باز کردن پوشه در GitHub</a>
                        </div>
                        ${partsHtml}
                    </div>
                    ${mergeCommand}
                </div>
            `;
        }
        
        // تابع اصلی برای بارگذاری همه ویدیوها
        async function loadAllVideos() {
            const container = document.getElementById('videos-container');
            container.innerHTML = '<div class="loading">⏳ در حال بارگذاری لیست ویدیوها...</div>';
            
            try {
                const folders = await getAllVideoFolders();
                
                if (folders.length === 0) {
                    container.innerHTML = '<div class="loading">📂 هیچ ویدیویی در پوشه videos یافت نشد. ابتدا ویدیویی دانلود کنید.</div>';
                    document.getElementById('totalVideos').textContent = '0';
                    document.getElementById('totalSize').textContent = '0 MB';
                    document.getElementById('lastUpdate').textContent = '-';
                    return;
                }
                
                let totalVideos = 0;
                let totalSize = 0;
                let sectionsHtml = '';
                
                for (const folder of folders) {
                    const files = await getFolderContents(folder.path);
                    if (files.length > 0) {
                        totalVideos++;
                        // محاسبه حجم کل پوشه
                        const folderSize = files.reduce((sum, f) => sum + (f.size || 0), 0);
                        totalSize += folderSize;
                        sectionsHtml += renderVideoSection(folder, files);
                    }
                }
                
                container.innerHTML = sectionsHtml;
                
                // بروزرسانی آمار
                document.getElementById('totalVideos').textContent = totalVideos;
                document.getElementById('totalSize').textContent = formatFileSize(totalSize);
                document.getElementById('lastUpdate').textContent = new Date().toLocaleString('fa-IR');
                
                if (totalVideos === 0) {
                    container.innerHTML = '<div class="loading">📂 هیچ ویدیویی یافت نشد. لطفاً ابتدا ویدیویی دانلود کنید.</div>';
                }
                
            } catch (error) {
                console.error('Error:', error);
                container.innerHTML = `<div class="error">❌ خطا در بارگذاری اطلاعات: ${error.message}<br><br>
                    <a href="https://github.com/${owner}/${repo}/tree/main/videos" target="_blank" style="color:#667eea">📁 مشاهده مستقیم پوشه videos در GitHub</a>
                </div>`;
            }
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // بارگذاری صفحه
        loadAllVideos();
    </script>
</body>
</html>
