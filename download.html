<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدیریت و دانلود ویدیوها - yt-dl</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .header h1 { font-size: 2em; margin-bottom: 10px; }
        .header p { opacity: 0.9; }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            padding: 20px 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #e0e0e0;
        }
        .stat-card {
            text-align: center;
            padding: 15px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .stat-card h3 { color: #667eea; font-size: 1.8em; }
        .stat-card p { color: #666; font-size: 0.9em; }
        
        .controls-bar {
            padding: 20px 30px;
            background: white;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e0e0e0;
        }
        .sort-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .sort-btn {
            background: #e0e0e0;
            color: #333;
            border: none;
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .sort-btn.active {
            background: #667eea;
            color: white;
        }
        .token-input {
            flex: 1;
            min-width: 250px;
            padding: 8px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 20px;
            direction: ltr;
            font-family: monospace;
        }
        .refresh-btn {
            background: #4caf50;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
        }
        
        .video-section {
            margin: 20px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 15px;
            border-right: 5px solid #667eea;
            transition: all 0.3s;
        }
        .video-section:hover {
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        .video-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 15px;
        }
        .video-title {
            font-size: 1.3em;
            color: #333;
            word-break: break-all;
            flex: 1;
        }
        .video-meta {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            font-size: 0.85em;
            color: #666;
            margin-bottom: 15px;
        }
        .video-meta span {
            background: white;
            padding: 5px 10px;
            border-radius: 15px;
        }
        .delete-btn {
            background: #f44336;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .delete-btn:hover {
            background: #d32f2f;
            transform: translateY(-2px);
        }
        
        .download-methods {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        .method-card {
            background: white;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #e0e0e0;
        }
        .method-card h4 {
            color: #667eea;
            margin-bottom: 10px;
        }
        button, .btn {
            background: #4caf50;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            margin: 5px;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        button:hover, .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        .btn-folder { background: #ff9800; }
        .btn-github { background: #24292e; }
        .btn-download-all { background: #2196f3; }
        
        .parts-list {
            margin-top: 15px;
            padding: 10px;
            background: #fff;
            border-radius: 8px;
            max-height: 250px;
            overflow-y: auto;
        }
        .part-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px;
            border-bottom: 1px solid #eee;
            flex-wrap: wrap;
            gap: 10px;
        }
        .part-name { font-family: monospace; font-size: 0.85em; word-break: break-all; flex: 1; }
        .part-size { color: #666; font-size: 0.8em; min-width: 70px; }
        
        .loading, .error, .empty {
            text-align: center;
            padding: 60px;
            color: #666;
        }
        .error { color: #f44336; }
        
        .merge-instruction {
            background: #e3f2fd;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            font-size: 0.9em;
        }
        .merge-instruction pre {
            background: #263238;
            color: #ffb74d;
            padding: 10px;
            border-radius: 5px;
            overflow-x: auto;
            font-size: 0.8em;
            margin-top: 10px;
        }
        
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #333;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            z-index: 1000;
            animation: fadeInOut 3s ease;
        }
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(20px); }
            15% { opacity: 1; transform: translateY(0); }
            85% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(20px); }
        }
        
        @media (max-width: 768px) {
            .video-title { font-size: 1.1em; }
            .video-header { flex-direction: column; }
            .method-card { padding: 10px; }
            .part-item { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- نوار منوی بالای صفحه - این کد را بعد از <div class="container"> قرار دهید -->
<div style="background: white; padding: 15px 30px; border-bottom: 1px solid #e0e0e0; display: flex; gap: 15px; flex-wrap: wrap; justify-content: center;">
    <a href="dashboard.html" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 10px 25px; border-radius: 25px; text-decoration: none; font-weight: bold; display: inline-block;">
        ➕ دانلود ویدیو جدید
    </a>
    <a href="download.html" style="background: #4caf50; color: white; padding: 10px 25px; border-radius: 25px; text-decoration: none; font-weight: bold; display: inline-block;">
        📂 مدیریت ویدیوها
    </a>
    <a href="https://github.com/miladntk/yt-dl" target="_blank" style="background: #24292e; color: white; padding: 10px 25px; border-radius: 25px; text-decoration: none; font-weight: bold; display: inline-block;">
        🐙 مشاهده در GitHub
    </a>
</div>
        <div class="header">
            <h1>📥 مدیریت و دانلود ویدیوها</h1>
            <p>YouTube Downloader Pro | با قابلیت حذف و مرتب‌سازی زمانی</p>
        </div>
        
        <div class="stats" id="stats">
            <div class="stat-card"><h3 id="totalVideos">-</h3><p>تعداد ویدیوها</p></div>
            <div class="stat-card"><h3 id="totalSize">-</h3><p>حجم کل</p></div>
            <div class="stat-card"><h3 id="lastUpdate">-</h3><p>آخرین بروزرسانی</p></div>
        </div>
        
        <div class="controls-bar">
            <div class="sort-buttons">
                <button class="sort-btn active" data-sort="newest">🕐 جدیدترین ابتدا</button>
                <button class="sort-btn" data-sort="oldest">🕐 قدیمی‌ترین ابتدا</button>
                <button class="sort-btn" data-sort="name">📝 بر اساس نام</button>
                <button class="sort-btn" data-sort="size">📊 بر اساس حجم</button>
            </div>
            <input type="password" id="githubToken" class="token-input" placeholder="🔑 توکن گیت‌هاب (برای حذف فایل‌ها الزامی است)" dir="ltr">
            <button class="refresh-btn" onclick="loadAllVideos()">🔄 بروزرسانی</button>
        </div>
        
        <div id="videos-container">
            <div class="loading">⏳ در حال بارگذاری لیست ویدیوها...</div>
        </div>
    </div>

    <script>
        const owner = 'miladntk';
        const repo = 'yt-dl';
        let allVideosData = [];
        let currentSort = 'newest';
        
        // نمایش پیام موقت
        function showToast(message, isError = false) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            toast.style.background = isError ? '#f44336' : '#4caf50';
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
        
        // فرمت حجم
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 B';
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(1024));
            return (bytes / Math.pow(1024, i)).toFixed(2) + ' ' + sizes[i];
        }
        
        // فرمت تاریخ
        function formatDate(dateString) {
            try {
                const date = new Date(dateString);
                return date.toLocaleDateString('fa-IR') + ' ' + date.toLocaleTimeString('fa-IR');
            } catch {
                return 'نامشخص';
            }
        }
        
        // دریافت تاریخ آخرین commit یک پوشه
        async function getFolderLastCommitDate(folderPath) {
            try {
                const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/commits?path=${folderPath}&page=1&per_page=1`);
                const commits = await response.json();
                if (commits && commits[0]) {
                    return commits[0].commit.committer.date;
                }
            } catch (e) {
                console.error('Error fetching commit date:', e);
            }
            return new Date().toISOString();
        }
        
        // دریافت همه پوشه‌های داخل videos
        async function getAllVideoFolders() {
            try {
                const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/videos`);
                if (!response.ok) throw new Error('خطا در دریافت اطلاعات');
                const contents = await response.json();
                return contents.filter(item => item.type === 'dir');
            } catch (error) {
                console.error('Error:', error);
                return [];
            }
        }
        
        // دریافت فایل‌های داخل یک پوشه
        async function getFolderContents(folderPath) {
            try {
                const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${folderPath}`);
                if (!response.ok) return [];
                return await response.json();
            } catch (error) {
                return [];
            }
        }
        
        // حذف فایل از GitHub
        async function deleteFileFromGitHub(filePath, fileName) {
            const token = document.getElementById('githubToken').value;
            
            if (!token) {
                showToast('❌ برای حذف فایل، لطفاً توکن گیت‌هاب را وارد کنید', true);
                return false;
            }
            
            try {
                // ابتدا دریافت SHA فایل
                const fileResponse = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${filePath}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (!fileResponse.ok) {
                    throw new Error('فایل یافت نشد');
                }
                
                const fileData = await fileResponse.json();
                
                // حذف فایل
                const deleteResponse = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${filePath}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: `🗑️ حذف فایل: ${fileName}`,
                        sha: fileData.sha
                    })
                });
                
                if (!deleteResponse.ok) {
                    const error = await deleteResponse.json();
                    throw new Error(error.message || 'خطا در حذف فایل');
                }
                
                showToast(`✅ فایل "${fileName}" با موفقیت حذف شد`);
                return true;
                
            } catch (error) {
                console.error('Delete error:', error);
                showToast(`❌ خطا: ${error.message}`, true);
                return false;
            }
        }
        
        // حذف کل پوشه
        async function deleteFolderFromGitHub(folderPath, folderName) {
            const token = document.getElementById('githubToken').value;
            
            if (!token) {
                showToast('❌ برای حذف پوشه، لطفاً توکن گیت‌هاب را وارد کنید', true);
                return false;
            }
            
            if (!confirm(`آیا از حذف کامل پوشه "${folderName}" اطمینان دارید؟ این عملیات غیرقابل بازگشت است.`)) {
                return false;
            }
            
            try {
                // دریافت لیست فایل‌های داخل پوشه
                const contentsResponse = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${folderPath}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const contents = await contentsResponse.json();
                
                // حذف هر فایل به صورت جداگانه
                let deletedCount = 0;
                for (const item of contents) {
                    const deleteResponse = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${item.path}`, {
                        method: 'DELETE',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: `🗑️ حذف فایل: ${item.name}`,
                            sha: item.sha
                        })
                    });
                    
                    if (deleteResponse.ok) deletedCount++;
                    await new Promise(resolve => setTimeout(resolve, 500));
                }
                
                showToast(`✅ پوشه "${folderName}" با حذف ${deletedCount} فایل پاک شد`);
                await loadAllVideos();
                return true;
                
            } catch (error) {
                console.error('Delete folder error:', error);
                showToast(`❌ خطا در حذف پوشه: ${error.message}`, true);
                return false;
            }
        }
        
        // گروه‌بندی قطعات zip
        function groupZipParts(files) {
            const zipParts = {};
            const otherFiles = [];
            
            files.forEach(file => {
                if (file.type !== 'file') return;
                if (file.name.match(/\.(zip|z[0-9]+)$/)) {
                    const baseName = file.name.replace(/\.(zip|z[0-9]+)$/, '');
                    if (!zipParts[baseName]) zipParts[baseName] = [];
                    zipParts[baseName].push(file);
                } else {
                    otherFiles.push(file);
                }
            });
            
            return { zipParts, otherFiles };
        }
        
        // دانلود همه قطعات
        function downloadAllParts(parts, folderName) {
            showToast(`شروع دانلود ${parts.length} قطعه برای "${folderName}"`);
            parts.forEach((part, index) => {
                setTimeout(() => {
                    const link = document.createElement('a');
                    link.href = part.download_url;
                    link.download = part.name;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                }, index * 800);
            });
        }
        
        // رندر بخش ویدیو
        function renderVideoSection(folder, files, lastCommitDate) {
            const { zipParts, otherFiles } = groupZipParts(files);
            const hasZipParts = Object.keys(zipParts).length > 0;
            const totalFolderSize = files.reduce((sum, f) => sum + (f.size || 0), 0);
            
            let partsHtml = '';
            if (hasZipParts) {
                for (const [baseName, parts] of Object.entries(zipParts)) {
                    const totalSize = parts.reduce((sum, p) => sum + p.size, 0);
                    partsHtml += `
                        <div class="method-card">
                            <h4>📦 فایل چندتکه (${parts.length} قطعه)</h4>
                            <p>حجم کل: ${formatFileSize(totalSize)}</p>
                            <button onclick='downloadAllParts(${JSON.stringify(parts)}, "${folder.name}")' class="btn-download-all">
                                ⬇️ دانلود همه ${parts.length} قطعه
                            </button>
                            <div class="parts-list">
                                ${parts.map(part => `
                                    <div class="part-item">
                                        <span class="part-name">📄 ${part.name}</span>
                                        <span class="part-size">${formatFileSize(part.size)}</span>
                                        <a href="${part.download_url}" download><button style="padding:5px 10px;">دانلود</button></a>
                                        <button onclick='deleteFile("${part.path}", "${part.name}")' style="background:#f44336; padding:5px 10px;">🗑️</button>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                }
            }
            
            if (otherFiles.length > 0) {
                partsHtml += `
                    <div class="method-card">
                        <h4>📄 فایل‌های معمولی</h4>
                        <div class="parts-list">
                            ${otherFiles.map(file => `
                                <div class="part-item">
                                    <span class="part-name">${file.name}</span>
                                    <span class="part-size">${formatFileSize(file.size)}</span>
                                    <a href="${file.download_url}" download><button>دانلود</button></a>
                                    <button onclick='deleteFile("${file.path}", "${file.name}")' style="background:#f44336;">🗑️</button>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }
            
            const mergeCommand = hasZipParts ? `
                <div class="merge-instruction">
                    <strong>🔧 نحوه合并 قطعات بعد از دانلود (ویندوز):</strong>
                    <pre>copy /B "${folder.name}.zip" + "${folder.name}.z01" + "${folder.name}.z02" + "${folder.name}.z03" "video-final.zip"</pre>
                </div>
            ` : '';
            
            return `
                <div class="video-section" data-folder="${folder.name}" data-date="${lastCommitDate}" data-size="${totalFolderSize}">
                    <div class="video-header">
                        <div class="video-title">📁 ${escapeHtml(folder.name)}</div>
                        <button onclick='deleteFolder("${folder.path}", "${folder.name}")' class="delete-btn">🗑️ حذف کل پوشه</button>
                    </div>
                    <div class="video-meta">
                        <span>📅 آخرین بروزرسانی: ${formatDate(lastCommitDate)}</span>
                        <span>📦 حجم کل: ${formatFileSize(totalFolderSize)}</span>
                        <span>📄 تعداد فایل: ${files.length}</span>
                    </div>
                    
                    <div class="download-methods">
                        <div class="method-card">
                            <h4>📂 مشاهده در GitHub</h4>
                            <a href="${folder.html_url}" target="_blank" class="btn btn-folder">📂 باز کردن پوشه</a>
                        </div>
                        ${partsHtml}
                    </div>
                    ${mergeCommand}
                </div>
            `;
        }
        
        // توابع global برای onclick
        window.deleteFile = async (filePath, fileName) => {
            if (await deleteFileFromGitHub(filePath, fileName)) {
                await loadAllVideos();
            }
        };
        
        window.deleteFolder = async (folderPath, folderName) => {
            if (await deleteFolderFromGitHub(folderPath, folderName)) {
                await loadAllVideos();
            }
        };
        
        window.downloadAllParts = downloadAllParts;
        
        // مرتب‌سازی و نمایش
        function sortAndDisplayVideos() {
            const container = document.getElementById('videos-container');
            let sorted = [...allVideosData];
            
            switch (currentSort) {
                case 'newest':
                    sorted.sort((a, b) => new Date(b.lastCommitDate) - new Date(a.lastCommitDate));
                    break;
                case 'oldest':
                    sorted.sort((a, b) => new Date(a.lastCommitDate) - new Date(b.lastCommitDate));
                    break;
                case 'name':
                    sorted.sort((a, b) => a.folder.name.localeCompare(b.folder.name));
                    break;
                case 'size':
                    sorted.sort((a, b) => b.totalSize - a.totalSize);
                    break;
            }
            
            if (sorted.length === 0) {
                container.innerHTML = '<div class="empty">📂 هیچ ویدیویی یافت نشد. ابتدا ویدیویی دانلود کنید.</div>';
            } else {
                container.innerHTML = sorted.map(v => 
                    renderVideoSection(v.folder, v.files, v.lastCommitDate)
                ).join('');
            }
            
            // بروزرسانی آمار
            const totalVideos = allVideosData.length;
            const totalSize = allVideosData.reduce((sum, v) => sum + v.totalSize, 0);
            document.getElementById('totalVideos').textContent = totalVideos;
            document.getElementById('totalSize').textContent = formatFileSize(totalSize);
            document.getElementById('lastUpdate').textContent = new Date().toLocaleString('fa-IR');
        }
        
        // بارگذاری همه ویدیوها
        async function loadAllVideos() {
            const container = document.getElementById('videos-container');
            container.innerHTML = '<div class="loading">⏳ در حال بارگذاری لیست ویدیوها...</div>';
            
            try {
                const folders = await getAllVideoFolders();
                
                if (folders.length === 0) {
                    container.innerHTML = '<div class="empty">📂 هیچ ویدیویی در پوشه videos یافت نشد.</div>';
                    allVideosData = [];
                    sortAndDisplayVideos();
                    return;
                }
                
                allVideosData = [];
                
                for (const folder of folders) {
                    const files = await getFolderContents(folder.path);
                    const lastCommitDate = await getFolderLastCommitDate(folder.path);
                    const totalSize = files.reduce((sum, f) => sum + (f.size || 0), 0);
                    
                    allVideosData.push({
                        folder,
                        files,
                        lastCommitDate,
                        totalSize
                    });
                }
                
                sortAndDisplayVideos();
                
            } catch (error) {
                console.error('Error:', error);
                container.innerHTML = `<div class="error">❌ خطا در بارگذاری اطلاعات: ${error.message}</div>`;
            }
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // تنظیم دکمه‌های مرتب‌سازی
        document.querySelectorAll('.sort-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentSort = btn.dataset.sort;
                sortAndDisplayVideos();
            });
        });
        
        // بارگذاری اولیه
        loadAllVideos();
    </script>
</body>
</html>
